<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Início | Área restrita</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f5b800'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='Arial, sans-serif' font-weight='800' font-size='14' fill='%23111214'%3EMZ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="area.css">
  <script type="module" src="inicio.js"></script>
</head>
<body class="area">

  <header class="site-header">
    <div class="area-esq">
    <a class="logo" href="../index.html" aria-label="Voltar ao site">
      <span class="logo-name">Marcos Zanette</span>
      <span class="logo-sub">Área restrita</span>
    </a>
      <div id="menu-area"></div>
    </div>
    <div class="area-top" id="area-top" hidden>
      <span class="usuario" id="usuario"></span>
      <button class="btn-link" id="btn-sair" type="button">Sair</button>
    </div>
  </header>

  <div class="aviso-demo" id="aviso-demo" hidden>
    <strong>Modo demonstração.</strong> Os dados ficam só neste navegador e os e-mails de alerta não são enviados.
    Para usar de verdade, configure o Supabase conforme o README.
    <button class="btn-link" id="btn-limpar-demo" type="button">Apagar dados de teste</button>
  </div>

  <main class="area-main" id="conteudo" hidden>
    <div class="inicio-cabecalho">
      <p class="inicio-data" id="inicio-data"></p>
      <h1 id="saudacao">Área restrita</h1>
      <p class="inicio-sub" id="inicio-sub"></p>
    </div>

    <p class="aviso-inicio" id="aviso-inicio" role="status" hidden></p>
    <p class="painel-intro aviso-vazio" id="aviso-vazio" hidden>Seu acesso está ativo. Quando houver módulos liberados para você, eles aparecem aqui.</p>

    <div class="inicio-grupos" id="grupos"></div>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
