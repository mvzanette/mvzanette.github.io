<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1000" width="2400" height="1000">
  <!-- Ilustração original: caminhão elétrico em estação de recarga (eletrificação de frota).
       Área importante concentrada no centro, para funcionar recortada em 16:10 e em faixa larga. -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101215"/>
      <stop offset="1" stop-color="#22262b"/>
    </linearGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f24"/>
      <stop offset="1" stop-color="#0e0f11"/>
    </linearGradient>
    <linearGradient id="bau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="1" stop-color="#bfc5cc"/>
    </linearGradient>
    <linearGradient id="cabine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc928"/>
      <stop offset="1" stop-color="#d9a300"/>
    </linearGradient>
    <linearGradient id="coluna" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#454c54"/>
      <stop offset="1" stop-color="#262a30"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5b800" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f5b800" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinheta" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="grade" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Fundo com grade técnica -->
  <rect width="2400" height="1000" fill="url(#ceu)"/>
  <rect width="2400" height="780" fill="url(#grade)"/>

  <!-- Linhas de transmissão -->
  <g fill="none" stroke="#2f343b" stroke-width="3">
    <path d="M1990 336 C1600 420 1150 400 700 300"/>
    <path d="M2110 336 C2250 372 2340 366 2400 352"/>
    <path d="M2004 404 C1640 470 1180 450 760 370"/>
  </g>

  <!-- Silhueta industrial ao fundo -->
  <g fill="#262a30">
    <rect x="0" y="600" width="260" height="180"/>
    <rect x="70" y="545" width="90" height="55"/>
    <rect x="300" y="430" width="36" height="350"/>
    <rect x="260" y="640" width="200" height="140"/>
    <rect x="460" y="560" width="210" height="220"/>
    <rect x="700" y="610" width="230" height="170"/>
    <rect x="930" y="500" width="120" height="280"/>
    <rect x="1050" y="590" width="210" height="190"/>
    <ellipse cx="1155" cy="590" rx="105" ry="22"/>
    <rect x="1260" y="540" width="180" height="240"/>
    <rect x="1440" y="620" width="250" height="160"/>
    <rect x="1700" y="525" width="150" height="255"/>
    <rect x="1850" y="610" width="320" height="170"/>
    <rect x="2170" y="560" width="230" height="220"/>
    <rect x="2230" y="420" width="32" height="140"/>
  </g>
  <g fill="#f5b800" opacity="0.28">
    <rect x="490" y="600" width="18" height="12"/><rect x="530" y="600" width="18" height="12"/><rect x="570" y="600" width="18" height="12"/>
    <rect x="490" y="640" width="18" height="12"/><rect x="570" y="640" width="18" height="12"/>
    <rect x="1730" y="570" width="18" height="12"/><rect x="1770" y="570" width="18" height="12"/><rect x="1730" y="610" width="18" height="12"/>
    <rect x="2200" y="600" width="18" height="12"/><rect x="2240" y="600" width="18" height="12"/><rect x="2280" y="640" width="18" height="12"/>
    <rect x="960" y="540" width="16" height="12"/><rect x="1000" y="540" width="16" height="12"/><rect x="960" y="580" width="16" height="12"/>
  </g>

  <!-- Torre de energia -->
  <g fill="none" stroke="#343a42" stroke-width="7" stroke-linejoin="round">
    <path d="M1985 780 L2035 300 L2065 300 L2115 780"/>
    <path d="M1975 336 H2125 M1992 404 H2108 M2005 480 L2095 560 M2095 480 L2005 560 M2022 600 L2078 690 M2078 600 L2022 690"/>
  </g>

  <!-- Chão -->
  <rect y="780" width="2400" height="220" fill="url(#chao)"/>
  <path d="M0 780H2400" stroke="#30353c" stroke-width="3"/>
  <g stroke="#f5b800" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round">
    <path d="M600 792 L540 1000"/>
    <path d="M1500 792 L1560 1000"/>
  </g>
  <path d="M1066 846 L992 912 L1036 912 L1012 972 L1100 900 L1056 900 Z" fill="#f5b800" opacity="0.16"/>

  <!-- Painel de análise: custo acumulado (diesel × elétrico) e ponto de retorno -->
  <g>
    <rect x="455" y="250" width="250" height="170" rx="14" fill="#1d2025" stroke="#3b4148" stroke-width="2"/>
    <path d="M485 395 H680 M485 395 V275" stroke="#3b4148" stroke-width="3" fill="none"/>
    <path d="M492 388 L672 282" stroke="#8a929a" stroke-width="5" stroke-dasharray="14 10" fill="none" stroke-linecap="round"/>
    <path d="M492 345 L672 303" stroke="#f5b800" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="611" cy="317" r="10" fill="#f5b800" stroke="#1d2025" stroke-width="4"/>
  </g>

  <!-- Painel da bateria -->
  <g>
    <rect x="925" y="168" width="310" height="124" rx="16" fill="#1d2025" stroke="#3b4148" stroke-width="2"/>
    <rect x="958" y="202" width="172" height="58" rx="10" fill="none" stroke="#f5b800" stroke-width="6"/>
    <rect x="1133" y="218" width="12" height="26" rx="3" fill="#f5b800"/>
    <rect x="970" y="214" width="34" height="34" rx="4" fill="#f5b800"/>
    <rect x="1011" y="214" width="34" height="34" rx="4" fill="#f5b800"/>
    <rect x="1052" y="214" width="34" height="34" rx="4" fill="#f5b800"/>
    <rect x="1093" y="214" width="26" height="34" rx="4" fill="#3b4148"/>
    <path d="M1196 200 L1172 236 L1188 236 L1178 266 L1208 226 L1192 226 Z" fill="#f5b800"/>
    <path d="M1080 292 V404" stroke="#f5b800" stroke-width="3" stroke-dasharray="4 12" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Sombra do caminhão -->
  <ellipse cx="1050" cy="786" rx="440" ry="16" fill="#000000" opacity="0.45"/>

  <!-- Caminhão elétrico -->
  <g>
    <rect x="690" y="688" width="740" height="24" fill="#23272c"/>
    <rect x="668" y="408" width="494" height="284" rx="10" fill="url(#bau)"/>
    <g stroke="#a9b0b8" stroke-width="3" opacity="0.6">
      <path d="M740 420 V630 M812 420 V630 M1018 420 V630 M1090 420 V630"/>
    </g>
    <rect x="668" y="640" width="494" height="22" fill="#f5b800"/>
    <circle cx="915" cy="530" r="66" fill="#16181b"/>
    <circle cx="915" cy="530" r="66" fill="none" stroke="#f5b800" stroke-width="5"/>
    <path d="M927 466 L881 538 L913 538 L901 594 L953 518 L921 518 Z" fill="#f5b800"/>

    <path d="M1166 692 V472 Q1166 458 1180 458 H1322 Q1336 458 1345 469 L1410 546 Q1418 556 1420 568 L1426 692 Z" fill="url(#cabine)"/>
    <path d="M1192 480 H1316 L1374 548 H1192 Z" fill="#15181c"/>
    <path d="M1252 480 H1278 L1238 548 H1212 Z" fill="#ffffff" opacity="0.09"/>
    <path d="M1292 560 V680" stroke="#b88a00" stroke-width="3"/>
    <rect x="1262" y="574" width="20" height="6" rx="3" fill="#8a6800"/>
    <path d="M1170 498 H1150 V552 H1162" fill="none" stroke="#2b3036" stroke-width="7" stroke-linejoin="round"/>
    <rect x="1398" y="648" width="36" height="44" rx="6" fill="#2b3036"/>
    <circle cx="1420" cy="616" r="46" fill="url(#brilho)"/>
    <rect x="1408" y="604" width="14" height="22" rx="4" fill="#fff4cc"/>
    <rect x="1336" y="590" width="34" height="26" rx="6" fill="#111214" stroke="#f5b800" stroke-width="3"/>

    <!-- Para-lamas e rodas -->
    <circle cx="820" cy="716" r="76" fill="#15181c"/>
    <circle cx="1300" cy="716" r="76" fill="#15181c"/>
    <g>
      <circle cx="820" cy="716" r="64" fill="#0b0c0e"/>
      <circle cx="820" cy="716" r="56" fill="none" stroke="#24282d" stroke-width="6"/>
      <circle cx="820" cy="716" r="36" fill="#3b4148"/>
      <circle cx="820" cy="716" r="36" fill="none" stroke="#6b737b" stroke-width="3"/>
      <circle cx="820" cy="716" r="14" fill="#f5b800"/>
    </g>
    <g>
      <circle cx="1300" cy="716" r="64" fill="#0b0c0e"/>
      <circle cx="1300" cy="716" r="56" fill="none" stroke="#24282d" stroke-width="6"/>
      <circle cx="1300" cy="716" r="36" fill="#3b4148"/>
      <circle cx="1300" cy="716" r="36" fill="none" stroke="#6b737b" stroke-width="3"/>
      <circle cx="1300" cy="716" r="14" fill="#f5b800"/>
    </g>
  </g>

  <!-- Cota técnica entre eixos -->
  <g stroke="#f5b800" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M820 830 H1300"/>
    <path d="M820 816 V844 M1300 816 V844"/>
    <path d="M834 824 L820 830 L834 836 M1286 824 L1300 830 L1286 836"/>
  </g>

  <!-- Estação de recarga -->
  <ellipse cx="1612" cy="430" rx="200" ry="200" fill="url(#brilho)" opacity="0.75"/>
  <g>
    <rect x="1528" y="768" width="168" height="16" rx="4" fill="#3b4148"/>
    <rect x="1550" y="330" width="124" height="442" rx="16" fill="url(#coluna)"/>
    <rect x="1550" y="330" width="124" height="30" rx="15" fill="#f5b800"/>
    <rect x="1550" y="344" width="124" height="16" fill="#f5b800"/>
    <rect x="1571" y="386" width="82" height="98" rx="8" fill="#0c0d0f"/>
    <path d="M1616 398 L1598 426 L1611 426 L1604 450 L1627 420 L1614 420 Z" fill="#f5b800"/>
    <rect x="1582" y="458" width="13" height="16" rx="2" fill="#f5b800"/>
    <rect x="1599" y="458" width="13" height="16" rx="2" fill="#f5b800"/>
    <rect x="1616" y="458" width="13" height="16" rx="2" fill="#f5b800"/>
    <rect x="1633" y="458" width="13" height="16" rx="2" fill="#3b4148"/>
    <rect x="1568" y="504" width="88" height="6" rx="3" fill="#f5b800" opacity="0.9"/>
    <rect x="1536" y="550" width="18" height="44" rx="4" fill="#111214"/>
  </g>

  <!-- Cabo de recarga com fluxo de energia -->
  <path d="M1370 603 C1420 650 1440 752 1482 752 C1524 752 1534 640 1545 574" fill="none" stroke="#111214" stroke-width="16" stroke-linecap="round"/>
  <path d="M1370 603 C1420 650 1440 752 1482 752 C1524 752 1534 640 1545 574" fill="none" stroke="#f5b800" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 18"/>

  <!-- Segunda estação, mais ao fundo -->
  <g transform="translate(1790 453) scale(0.72)" opacity="0.6">
    <rect x="0" y="0" width="124" height="442" rx="16" fill="url(#coluna)"/>
    <rect x="0" y="0" width="124" height="30" rx="15" fill="#f5b800"/>
    <rect x="0" y="14" width="124" height="16" fill="#f5b800"/>
    <rect x="21" y="56" width="82" height="98" rx="8" fill="#0c0d0f"/>
    <rect x="18" y="174" width="88" height="6" rx="3" fill="#f5b800"/>
  </g>

  <rect width="2400" height="1000" fill="url(#vinheta)"/>
</svg>
