<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1000" width="2400" height="1000">
  <!-- Ilustração original: manutenção industrial (conjunto motor-bomba, ponte rolante, painel de comando,
       vaso de pressão em plataforma). Área importante concentrada no centro, para funcionar recortada
       em 16:10 e em faixa larga. -->
  <defs>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101215"/>
      <stop offset="1" stop-color="#22262b"/>
    </linearGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f24"/>
      <stop offset="1" stop-color="#0e0f11"/>
    </linearGradient>
    <linearGradient id="janela" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36414c"/>
      <stop offset="1" stop-color="#1d2329"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d858d"/>
      <stop offset="1" stop-color="#3a4047"/>
    </linearGradient>
    <linearGradient id="metalClaro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dde1e5"/>
      <stop offset="1" stop-color="#959ca4"/>
    </linearGradient>
    <linearGradient id="tanque" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a828a"/>
      <stop offset="0.35" stop-color="#d3d8dd"/>
      <stop offset="1" stop-color="#5f666e"/>
    </linearGradient>
    <linearGradient id="painel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d545c"/>
      <stop offset="1" stop-color="#2a2e34"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vinheta" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="ondulado" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 0V40" stroke="#ffffff" stroke-opacity="0.03" stroke-width="3"/>
    </pattern>
    <pattern id="trelica" width="60" height="44" patternUnits="userSpaceOnUse">
      <path d="M0 0 L30 44 L60 0" fill="none" stroke="#c99700" stroke-width="5"/>
    </pattern>
    <pattern id="faixas" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#16181b"/>
      <rect width="14" height="28" fill="#f5b800"/>
    </pattern>
  </defs>

  <!-- Parede do galpão -->
  <rect width="2400" height="770" fill="url(#parede)"/>
  <rect width="2400" height="770" fill="url(#ondulado)"/>
  <g fill="url(#janela)" opacity="0.85">
