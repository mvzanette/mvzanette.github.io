    <g>
      <circle cx="1322" cy="710" r="70" fill="#0b0c0e"/>
      <circle cx="1322" cy="710" r="61" fill="none" stroke="#24282d" stroke-width="7" stroke-dasharray="10 8"/>
      <circle cx="1322" cy="710" r="38" fill="#3b4148"/>
      <circle cx="1322" cy="710" r="38" fill="none" stroke="#6b737b" stroke-width="3"/>
      <circle cx="1322" cy="710" r="15" fill="#f5b800"/>
    </g>
    <!-- Braço de elevação e caçamba (na frente das rodas, para a máquina ficar reconhecível) -->
