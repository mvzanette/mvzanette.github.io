    <circle cx="1980" cy="630" r="34" fill="url(#brilho)"/>
    <rect x="1972" y="620" width="12" height="18" rx="3" fill="#fff4cc"/>
    <path d="M1840 576 H1824 V616 H1834" fill="none" stroke="#2b3036" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="1600" cy="722" r="70" fill="#15181c"/>
    <circle cx="1690" cy="722" r="70" fill="#15181c"/>
    <circle cx="1910" cy="722" r="70" fill="#15181c"/>
    <g>
