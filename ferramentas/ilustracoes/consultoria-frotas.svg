    <circle cx="488" cy="746" r="22" fill="#3b4148"/>
    <circle cx="488" cy="746" r="7" fill="#f5b800"/>
    <circle cx="732" cy="746" r="22" fill="#3b4148"/>
    <circle cx="732" cy="746" r="7" fill="#f5b800"/>
    <rect x="540" y="696" width="180" height="18" fill="#23272c"/>
    <rect x="452" y="616" width="70" height="80" rx="18" fill="#d9a300"/>
    <rect x="480" y="606" width="250" height="92" rx="12" fill="url(#amarelo)"/>
