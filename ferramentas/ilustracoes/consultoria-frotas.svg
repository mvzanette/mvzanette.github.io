      <circle cx="1098" cy="710" r="61" fill="none" stroke="#24282d" stroke-width="7" stroke-dasharray="10 8"/>
      <circle cx="1098" cy="710" r="38" fill="#3b4148"/>
      <circle cx="1098" cy="710" r="38" fill="none" stroke="#6b737b" stroke-width="3"/>
      <circle cx="1098" cy="710" r="15" fill="#f5b800"/>
