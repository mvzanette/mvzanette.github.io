      <circle cx="1600" cy="722" r="32" fill="#3b4148"/>
      <circle cx="1600" cy="722" r="12" fill="#f5b800"/>
      <circle cx="1690" cy="722" r="58" fill="#0b0c0e"/>
      <circle cx="1690" cy="722" r="32" fill="#3b4148"/>
      <circle cx="1690" cy="722" r="12" fill="#f5b800"/>
      <circle cx="1910" cy="722" r="58" fill="#0b0c0e"/>
