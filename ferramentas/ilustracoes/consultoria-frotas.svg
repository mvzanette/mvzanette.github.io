    </g>
  </g>
  <path d="M520 330 V540" stroke="#f5b800" stroke-width="3" stroke-dasharray="4 12" stroke-linecap="round" opacity="0.7"/>

  <!-- Painel: disponibilidade por equipamento (meta tracejada) -->
  <g>
    <rect x="1050" y="146" width="300" height="156" rx="14" fill="#1d2025" stroke="#3b4148" stroke-width="2"/>
    <circle cx="1080" cy="186" r="8" fill="#f5b800"/>
    <circle cx="1080" cy="224" r="8" fill="#f5b800"/>
    <circle cx="1080" cy="262" r="8" fill="#8a929a"/>
    <g fill="#2b3036">
