    <rect x="1158" y="514" width="78" height="58" rx="4" fill="#15181c"/>
    <path d="M1196 514 H1212 L1186 572 H1170 Z" fill="#ffffff" opacity="0.09"/>
    <circle cx="1098" cy="710" r="82" fill="#15181c"/>
    <circle cx="1322" cy="710" r="82" fill="#15181c"/>
    <g>
