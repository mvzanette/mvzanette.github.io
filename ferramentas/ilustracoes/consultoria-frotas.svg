    <path d="M1264 596 L1380 646" stroke="#2b3036" stroke-width="12" stroke-linecap="round"/>
    <path d="M1300 616 L1356 640" stroke="#c9ced3" stroke-width="6" stroke-linecap="round"/>
    <path d="M1398 650 L1452 636 Q1484 700 1468 766 L1398 766 Q1388 706 1398 650 Z" fill="#3b4148"/>
    <rect x="1398" y="760" width="72" height="8" rx="2" fill="#6b737b"/>
    <circle cx="1404" cy="694" r="10" fill="#2b3036"/>
  </g>

  <!-- Caminhão basculante -->
  <ellipse cx="1760" cy="786" rx="250" ry="12" fill="#000000" opacity="0.45"/>
  <g>
