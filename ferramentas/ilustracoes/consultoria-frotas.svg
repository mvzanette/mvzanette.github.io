      <rect x="476" y="260" width="24" height="24" rx="4"/><rect x="510" y="260" width="24" height="24" rx="4"/><rect x="544" y="260" width="24" height="24" rx="4"/><rect x="578" y="260" width="24" height="24" rx="4"/><rect x="646" y="260" width="24" height="24" rx="4"/>
      <rect x="476" y="294" width="24" height="24" rx="4"/><rect x="544" y="294" width="24" height="24" rx="4"/><rect x="578" y="294" width="24" height="24" rx="4"/><rect x="612" y="294" width="24" height="24" rx="4"/><rect x="646" y="294" width="24" height="24" rx="4"/>
    </g>
    <g fill="#f5b800">
